name: Android CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37 platform
        run: sdkmanager "platforms;android-37" "build-tools;35.0.0" "build-tools;36.0.0" || sdkmanager "platforms;android-37"

      - uses: gradle/actions/setup-gradle@v3
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure GitHub Packages credentials
        env:
          GPR_USER: ${{ github.actor }}
          # Prefer a packages-capable PAT; fall back to the default workflow token.
          GPR_KEY: ${{ secrets.PAT != '' && secrets.PAT || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.gradle"
          {
            echo "gpr.user=${GPR_USER}"
            echo "gpr.key=${GPR_KEY}"
          } >> "$HOME/.gradle/gradle.properties"
          # Also expose env fallbacks used by settings.gradle.kts
          echo "GITHUB_ACTOR=${GPR_USER}" >> "$GITHUB_ENV"
          echo "GITHUB_TOKEN=${GPR_KEY}" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testGenericDebugUnitTest

      - name: Build with Gradle
        run: ./gradlew buildGenericRelease
