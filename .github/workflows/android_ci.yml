name: Android CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37 platform
        run: sdkmanager "platforms;android-37" "build-tools;35.0.0" "build-tools;36.0.0" || sdkmanager "platforms;android-37"

      - uses: gradle/actions/setup-gradle@v3
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew testGenericDebugUnitTest

      - name: Build with Gradle
        run: ./gradlew buildGenericRelease
